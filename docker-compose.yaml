version: '3'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  weather-producer:
    build: .
    container_name: weather-producer
    depends_on:
      - kafka
    volumes:
      - .:/app
    environment:
      KAFKA_BROKER: kafka:9092
    command: tail -f /dev/null

  # CHANGED THIS: No Dockerfile needed anymore
  spark-consumer:
    build: 
      context: .
      dockerfile: Dockerfile.cosumer
    container_name: spark-consumer
    depends_on:
      - kafka
    volumes:
      - .:/app
      # The command is now handled by the Dockerfile, but you can override it here if needed
    command: tail -f /dev/null
    
  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.0
    container_name: kafdrop
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:9092"
      JVM_OPTS: "-Xms32M -Xmx64M"
      SERVER_SERVLET_CONTEXTPATH: "/"